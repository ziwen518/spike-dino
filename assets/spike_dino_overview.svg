<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="500" viewBox="0 0 1440 500" role="img" aria-labelledby="title desc">
  <title id="title">Spike-DINO method overview</title>
  <desc id="desc">Event views feed a spiking student and EMA teacher. The evidence block uses visible-event normalized attention, bipolar spikes, and bounded membrane residuals.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#071426"/><stop offset="1" stop-color="#12294a"/></linearGradient>
    <linearGradient id="cyan" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#20d5d2"/><stop offset="1" stop-color="#4a8cff"/></linearGradient>
    <linearGradient id="violet" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#9b7bff"/><stop offset="1" stop-color="#df6ff2"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="10" stdDeviation="12" flood-opacity=".22"/></filter>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#8ea9cc"/></marker>
    <style>
      .title{font:700 34px Inter,Segoe UI,Arial,sans-serif;fill:#f7fbff}.sub{font:400 17px Inter,Segoe UI,Arial,sans-serif;fill:#a9bed8}.head{font:700 19px Inter,Segoe UI,Arial,sans-serif;fill:#f7fbff}.body{font:400 15px Inter,Segoe UI,Arial,sans-serif;fill:#b9cce3}.tiny{font:600 13px Inter,Segoe UI,Arial,sans-serif;fill:#7fe8e4}.card{fill:#10243e;stroke:#294a70;stroke-width:1.5}.line{stroke:#8ea9cc;stroke-width:2.2;fill:none;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1440" height="500" rx="28" fill="url(#bg)"/>
  <circle cx="1280" cy="40" r="210" fill="#1b4e7e" opacity=".18"/><circle cx="80" cy="470" r="190" fill="#713c9c" opacity=".12"/>
  <text x="60" y="62" class="title">Spike-DINO</text>
  <text x="60" y="91" class="sub">Event-native self-distillation with spike-driven evidence transport</text>

  <g filter="url(#shadow)">
    <rect x="55" y="145" width="220" height="220" rx="22" class="card"/>
    <rect x="315" y="125" width="275" height="260" rx="22" class="card"/>
    <rect x="635" y="125" width="350" height="260" rx="22" class="card"/>
    <rect x="1030" y="125" width="350" height="260" rx="22" class="card"/>
  </g>

  <text x="85" y="184" class="tiny">EVENT VIEWS</text>
  <text x="85" y="218" class="head">DVS recording</text>
  <g fill="url(#cyan)"><circle cx="100" cy="260" r="5"/><circle cx="133" cy="288" r="4"/><circle cx="180" cy="249" r="6"/><circle cx="222" cy="305" r="5"/><circle cx="156" cy="325" r="4"/><circle cx="238" cy="242" r="3"/></g>
  <path d="M85 340 H245" stroke="#355a80"/><text x="85" y="357" class="body">space · time · polarity</text>

  <text x="345" y="164" class="tiny">TEACHER / STUDENT</text>
  <rect x="345" y="194" width="215" height="62" rx="13" fill="#183657" stroke="#36cbc8"/><text x="372" y="232" class="head">Spiking student</text>
  <rect x="345" y="286" width="215" height="62" rx="13" fill="#183657" stroke="#a881ef"/><text x="380" y="324" class="head">EMA teacher</text>
  <path d="M527 278 C520 268,520 264,527 257" class="line"/><text x="345" y="373" class="body">DINO global + iBOT dense targets</text>

  <text x="665" y="164" class="tiny">EVIDENCE SPIKE BLOCK</text>
  <rect x="665" y="190" width="290" height="46" rx="11" fill="#173553"/><text x="695" y="220" class="head">Binary Q / K / V spikes</text>
  <rect x="665" y="250" width="290" height="46" rx="11" fill="#173553"/><text x="687" y="280" class="head">Visible T×N count attention</text>
  <rect x="665" y="310" width="290" height="46" rx="11" fill="#173553"/><text x="690" y="340" class="head">ON/OFF spike projection</text>
  <path d="M810 237 V248" class="line"/><path d="M810 297 V308" class="line"/>

  <text x="1060" y="164" class="tiny">CONTROLLED MEMBRANE WRITE</text>
  <text x="1060" y="212" class="head">Evidence-normalized current</text>
  <text x="1060" y="247" class="body">preserve coincidence counts</text>
  <text x="1060" y="276" class="body">exclude hidden event content</text>
  <text x="1060" y="305" class="body">bound residual energy by depth</text>
  <rect x="1060" y="329" width="286" height="36" rx="18" fill="url(#violet)" opacity=".92"/>
  <text x="1112" y="353" class="head">membrane carrier U′</text>

  <path d="M276 255 H312" class="line"/><path d="M591 255 H632" class="line"/><path d="M986 255 H1027" class="line"/>
  <text x="60" y="449" class="sub">Learned synapses consume spikes · coincidence accumulators and residual membrane carriers remain real-valued</text>
  <rect x="1160" y="426" width="220" height="44" rx="22" fill="url(#cyan)"/><text x="1202" y="454" class="head">research preview</text>
</svg>
